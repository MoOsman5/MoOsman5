    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0234e"/><stop offset="0.4" stop-color="#c084fc"/><stop offset="0.7" stop-color="#7aa2ff"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7aa2ff" fill-opacity="0.08"/></pattern>
