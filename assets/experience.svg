      <text x="640" y="816" class="mono" font-size="11" fill="#64748b">AWARDS</text>
      <text x="640" y="842" class="sans" font-size="17" font-weight="700" fill="#f1f5f9">ECPC · 2022</text>
      <text x="640" y="864" class="mono" font-size="12.5" fill="#94a3b8">Egyptian Collegiate Programming Contest</text>
