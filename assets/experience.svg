<g class="card" style="animation-delay:0.25s"><circle cx="64" cy="124" r="9" fill="#05070f" stroke="#e0234e" stroke-width="2.5"/><circle class="pulse" cx="64" cy="124" r="4" fill="#e0234e"/><rect x="100" y="96" width="1060" height="200" rx="14" fill="#0b1224" stroke="#e0234e" stroke-opacity="0.55"/><rect x="100" y="110" width="3" height="172" rx="1.5" fill="#e0234e"/><text x="124" y="130" class="sans" font-size="20" font-weight="800" fill="#f8fafc">ABS Courier</text><text x="1140" y="130" text-anchor="end" class="mono" font-size="12" fill="#64748b">Cairo, Egypt</text><text x="124" y="158" class="sans" font-size="15" font-weight="700" fill="#e0234e">Backend Team Leader</text><text x="1140" y="158" text-anchor="end" class="mono" font-size="13" fill="#cbd5e1">2024/11 – 2026/10</text><text x="124" y="178" class="mono" font-size="12.5" fill="#94a3b8">Designed &amp; built the logistics platform from scratch · 20M+ shipments/yr · led a team of 5</text><path d="M132 186 L132 208" stroke="#334155" stroke-dasharray="2 3"/><text x="140" y="202" class="mono" font-size="10" fill="#64748b">promoted ↑ from</text><text x="124" y="220" class="sans" font-size="15" font-weight="700" fill="#e0234e">Full Stack Developer</text><text x="1140" y="220" text-anchor="end" class="mono" font-size="13" fill="#cbd5e1">2024/05 – 2024/11</text><text x="124" y="240" class="mono" font-size="12.5" fill="#94a3b8">Proposed NestJS + PostgreSQL for the replacement · owned the backend within 6 months</text><rect x="124" y="260" width="61" height="22" rx="11" fill="#e0234e" fill-opacity="0.12" stroke="#e0234e" stroke-opacity="0.45"/><text x="133" y="275" class="mono" font-size="12" fill="#e0234e">NestJS</text><rect x="193" y="260" width="90" height="22" rx="11" fill="#e0234e" fill-opacity="0.12" stroke="#e0234e" stroke-opacity="0.45"/><text x="202" y="275" class="mono" font-size="12" fill="#e0234e">PostgreSQL</text><rect x="291" y="260" width="83" height="22" rx="11" fill="#e0234e" fill-opacity="0.12" stroke="#e0234e" stroke-opacity="0.45"/><text x="300" y="275" class="mono" font-size="12" fill="#e0234e">PgBouncer</text><rect x="382" y="260" width="54" height="22" rx="11" fill="#e0234e" fill-opacity="0.12" stroke="#e0234e" stroke-opacity="0.45"/><text x="391" y="275" class="mono" font-size="12" fill="#e0234e">Redis</text><rect x="444" y="260" width="47" height="22" rx="11" fill="#e0234e" fill-opacity="0.12" stroke="#e0234e" stroke-opacity="0.45"/><text x="453" y="275" class="mono" font-size="12" fill="#e0234e">Bull</text><rect x="499" y="260" width="61" height="22" rx="11" fill="#e0234e" fill-opacity="0.12" stroke="#e0234e" stroke-opacity="0.45"/><text x="508" y="275" class="mono" font-size="12" fill="#e0234e">Docker</text><rect x="568" y="260" width="40" height="22" rx="11" fill="#e0234e" fill-opacity="0.12" stroke="#e0234e" stroke-opacity="0.45"/><text x="577" y="275" class="mono" font-size="12" fill="#e0234e">AWS</text></g>
