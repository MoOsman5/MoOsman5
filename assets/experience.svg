<g class="card" style="animation-delay:0.95s"><circle cx="64" cy="492" r="9" fill="#05070f" stroke="#7aa2ff" stroke-width="2.5"/><circle class="pulse" cx="64" cy="492" r="4" fill="#7aa2ff"/><rect x="100" y="464" width="1060" height="128" rx="14" fill="#0b1224" stroke="#7aa2ff" stroke-opacity="0.55"/><rect x="100" y="478" width="3" height="100" rx="1.5" fill="#7aa2ff"/><text x="124" y="498" class="sans" font-size="20" font-weight="800" fill="#f8fafc">NasNav</text><text x="1140" y="498" text-anchor="end" class="mono" font-size="12" fill="#64748b">Al Rehab City, Egypt</text><text x="124" y="526" class="sans" font-size="15" font-weight="700" fill="#7aa2ff">Software Developer</text><text x="1140" y="526" text-anchor="end" class="mono" font-size="13" fill="#cbd5e1">2023/06 – 2024/05</text><text x="124" y="546" class="mono" font-size="12.5" fill="#94a3b8">Built React web apps and cross-platform React Native apps on top of backend APIs</text><rect x="124" y="556" width="54" height="22" rx="11" fill="#7aa2ff" fill-opacity="0.12" stroke="#7aa2ff" stroke-opacity="0.45"/><text x="133" y="571" class="mono" font-size="12" fill="#7aa2ff">React</text><rect x="186" y="556" width="104" height="22" rx="11" fill="#7aa2ff" fill-opacity="0.12" stroke="#7aa2ff" stroke-opacity="0.45"/><text x="195" y="571" class="mono" font-size="12" fill="#7aa2ff">React Native</text></g>
<g class="card" style="animation-delay:1.30s"><circle cx="64" cy="640" r="9" fill="#05070f" stroke="#22c55e" stroke-width="2.5"/><circle class="pulse" cx="64" cy="640" r="4" fill="#22c55e"/><rect x="100" y="612" width="1060" height="128" rx="14" fill="#0b1224" stroke="#22c55e" stroke-opacity="0.55"/><rect x="100" y="626" width="3" height="100" rx="1.5" fill="#22c55e"/><text x="124" y="646" class="sans" font-size="20" font-weight="800" fill="#f8fafc">Teqneia ICT</text><text x="1140" y="646" text-anchor="end" class="mono" font-size="12" fill="#64748b">El Sheikh Zayed, Egypt</text><text x="124" y="674" class="sans" font-size="15" font-weight="700" fill="#22c55e">Software Developer</text><text x="1140" y="674" text-anchor="end" class="mono" font-size="13" fill="#cbd5e1">2022/06 – 2023/06</text><text x="124" y="694" class="mono" font-size="12.5" fill="#94a3b8">Built responsive React.js web applications for client projects</text><rect x="124" y="704" width="76" height="22" rx="11" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.45"/><text x="133" y="719" class="mono" font-size="12" fill="#22c55e">React.js</text></g>
    <line x1="40" y1="776" x2="1160" y2="776" stroke="#1e293b"/>
    <g class="card" style="animation-delay:1.7s">
